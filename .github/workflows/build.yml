name: Build IG

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Jekyll
        run: gem install jekyll

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install SUSHI
        run: npm install -g fsh-sushi

      - name: Run SUSHI
        run: sushi build .

      # Pinned: the errors check below depends on the qa.json layout of this version.
      - name: Download IG Publisher
        env:
          PUBLISHER_VERSION: 3.0.0
        run: |
          mkdir -p input-cache
          curl -sSfL -o input-cache/publisher.jar \
            "https://github.com/HL7/fhir-ig-publisher/releases/download/${PUBLISHER_VERSION}/publisher.jar"

      # The published package has an empty .index.json, so the publisher finds none of
      # its resources. Without the index file, the publisher rebuilds it. See known-issues.md.
      - name: Work around empty index of Backport package
        run: |
          dir="$HOME/.fhir/packages/hl7.fhir.uv.subscriptions-backport.r4#1.1.0"
          mkdir -p "$dir"
          curl -sSfL "https://packages.fhir.org/hl7.fhir.uv.subscriptions-backport.r4/1.1.0" | tar xz -C "$dir"
          rm "$dir/package/.index.json"

      - name: Build IG
        run: java -jar input-cache/publisher.jar -ig . -no-sushi

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ig-output
          path: output/
          if-no-files-found: warn

      # The publisher exits with 0 even when qa.html reports errors, so check the
      # errors ourselves: every error in output/qa.xml must be listed in known-errors.txt.
      - name: Fail on unknown errors in QA report
        run: python3 .github/scripts/check-qa.py
