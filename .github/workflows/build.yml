name: Build IG

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Jekyll
        run: gem install jekyll

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install SUSHI
        run: npm install -g fsh-sushi

      - name: Run SUSHI
        run: sushi build .

      # Pinned: the errors check below depends on the qa.json layout of this version.
      - name: Download IG Publisher
        env:
          PUBLISHER_VERSION: 3.0.0
        run: |
          mkdir -p input-cache
          curl -sSfL -o input-cache/publisher.jar \
            "https://github.com/HL7/fhir-ig-publisher/releases/download/${PUBLISHER_VERSION}/publisher.jar"

      # The published package has an empty .index.json, so the publisher finds none of
      # its resources. Without the index file, the publisher rebuilds it. See known-issues.md.
      - name: Work around empty index of Backport package
        run: |
          dir="$HOME/.fhir/packages/hl7.fhir.uv.subscriptions-backport.r4#1.1.0"
          mkdir -p "$dir"
          curl -sSfL "https://packages.fhir.org/hl7.fhir.uv.subscriptions-backport.r4/1.1.0" | tar xz -C "$dir"
          rm "$dir/package/.index.json"

      - name: Build IG
        run: java -jar input-cache/publisher.jar -ig . -no-sushi

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ig-output
          path: output/
          if-no-files-found: warn

      # The template's lang-redirects.js is overridden by input/images/assets/js/; fail if the
      # override did not take effect or the redirect does not work. See known-issues.md.
      - name: Test language redirect
        run: node test/lang-redirects.test.js

      # The template's fragment-pagebegin.html is overridden by input/includes/ to show the release
      # label; fail if the label is missing or the template file changed. See known-issues.md.
      - name: Test release label
        run: node test/release-label.test.js

      # The publisher exits with 0 even when qa.html reports errors, so check the
      # errors ourselves: every error in output/qa.xml and output/qa.txt must be listed
      # in known-errors.txt.
      - name: Fail on unknown errors in QA report
        run: python3 .github/scripts/check-qa.py

      # Every instance in test/invalid/ must be reported with the invariant in its file name, or
      # with the text in its .expect file. Validator pinned to 7.0.1, the org.hl7.fhir.core
      # version inside IG Publisher 3.0.0; update both together.
      - name: Download validator
        env:
          VALIDATOR_VERSION: 7.0.1
          VALIDATOR_SHA256: 1178b6a3a3fe98d9cd9545cadee505274967332466001d857e4d8bed7138a5bc
        run: |
          curl -sSfL -o input-cache/validator_cli.jar \
            "https://github.com/hapifhir/org.hl7.fhir.core/releases/download/${VALIDATOR_VERSION}/validator_cli.jar"
          echo "${VALIDATOR_SHA256}  input-cache/validator_cli.jar" | shasum -a 256 -c -

      - name: Validate invalid examples
        run: test/validate-invalid.sh input-cache/validator_cli.jar
