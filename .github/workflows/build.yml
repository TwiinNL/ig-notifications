name: Build IG

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Jekyll
        run: gem install jekyll

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install SUSHI
        run: npm install -g fsh-sushi

      - name: Run SUSHI
        run: sushi build .

      # Pinned: the errors check below depends on the qa.json layout of this version.
      - name: Download IG Publisher
        env:
          PUBLISHER_VERSION: 3.0.0
        run: |
          mkdir -p input-cache
          curl -sSfL -o input-cache/publisher.jar \
            "https://github.com/HL7/fhir-ig-publisher/releases/download/${PUBLISHER_VERSION}/publisher.jar"

      - name: Build IG
        run: java -jar input-cache/publisher.jar -ig . -no-sushi

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ig-output
          path: output/
          if-no-files-found: warn

      # The publisher exits with 0 even when qa.html reports errors,
      # so fail on the error count in output/qa.json ("errs").
      - name: Fail on errors in QA report
        run: |
          test -f output/qa.json || { echo "output/qa.json not found"; exit 1; }
          errs=$(jq -er '.errs' output/qa.json)
          echo "errors=$errs warnings=$(jq -r '.warnings' output/qa.json) hints=$(jq -r '.hints' output/qa.json)"
          if [ "$errs" -gt 0 ]; then
            echo "::error::IG build has $errs error(s); see qa.html in the ig-output artifact"
            grep '^ERROR' output/qa.txt || true
            exit 1
          fi
